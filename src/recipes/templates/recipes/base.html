<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cocktails{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    {% block head %}{% endblock %}
    <style>
        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
        }
        .recipe-card {
            display: flex;
            flex-direction: column;
            position: relative;
            height: 240px;
            padding: 0.75rem;
            border: 1px solid var(--pico-muted-border-color);
            border-radius: var(--pico-border-radius);
        }
        .card-glassware {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            opacity: 0.5;
        }
        .card-glassware img {
            width: 32px;
            height: 32px;
            display: block;
        }
        .recipe-card-body {
            flex: 1;
            overflow: hidden;
        }
        .recipe-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 0.35rem;
            border-top: 1px solid var(--pico-muted-border-color);
            margin-top: 0.35rem;
            flex-shrink: 0;
        }
        .tag-icons { display: flex; gap: 3px; align-items: center; }
        .tag-icon { width: 16px; height: 16px; opacity: 0.65; }
        .recipe-detail-icons {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 0.5rem;
        }
        .glassware-detail {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--pico-muted-color);
            font-size: 0.9rem;
        }
        .glassware-icon-detail { width: 28px; height: 28px; opacity: 0.75; }
        .tag-icons-detail { display: flex; gap: 5px; align-items: center; }
        .recipe-card h3 {
            margin: 0 0 0.5rem 0;
            padding-right: 2.5rem;
            font-size: 1rem;
            line-height: 1.2;
        }
        .recipe-card h3 a {
            text-decoration: none;
        }
        .recipe-card ul.ingredients {
            font-size: 0.8rem;
            color: var(--pico-muted-color);
            line-height: 1.3;
            list-style: none !important;
            padding: 0 !important;
            margin: 0 !important;
        }
        .recipe-card ul.ingredients li {
            margin: 0;
            padding: 0;
            list-style: none !important;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .recipe-card ul.ingredients li::before {
            content: none !important;
        }
        .recipe-card ul.ingredients li strong {
            font-weight: 600;
        }
        .recipe-card .more-ingredients {
            font-size: 0.8rem;
            color: var(--pico-muted-color);
            font-style: italic;
            margin-top: 0.25rem;
        }
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            align-items: flex-start;
        }
        .filter-row select,
        .filter-row input:not([type="checkbox"]):not([type="radio"]) {
            flex: 1 1 200px;
            min-width: 160px;
            margin-bottom: 0;
        }
        /* Custom tag dropdown */
        .tag-dropdown {
            position: relative;
            flex: 1 1 200px;
            min-width: 160px;
        }
        .tag-dropdown-toggle {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            background-color: var(--pico-form-element-background-color);
            color: var(--pico-form-element-placeholder-color);
            border: var(--pico-border-width) solid var(--pico-form-element-border-color);
            border-radius: var(--pico-border-radius);
            padding: var(--pico-form-element-spacing-vertical) var(--pico-form-element-spacing-horizontal);
            font-size: 1rem;
            font-weight: normal;
            cursor: pointer;
            margin: 0;
            box-shadow: none;
            text-align: left;
            line-height: var(--pico-line-height);
        }
        .tag-dropdown-toggle:hover,
        .tag-dropdown-toggle:focus {
            background-color: var(--pico-form-element-background-color);
            border-color: var(--pico-form-element-active-border-color);
            color: var(--pico-form-element-placeholder-color);
            box-shadow: none;
        }
        .tag-dropdown-toggle.has-selection {
            color: var(--pico-form-element-color);
        }
        .tag-dropdown-toggle.has-selection:hover,
        .tag-dropdown-toggle.has-selection:focus {
            color: var(--pico-form-element-color);
        }
        .tag-dropdown-arrow {
            display: inline-block;
            flex-shrink: 0;
            font-style: normal;
            transition: transform 0.15s ease;
            line-height: 1;
        }
        .tag-dropdown-toggle[aria-expanded="true"] .tag-dropdown-arrow {
            transform: rotate(180deg);
        }
        .tag-dropdown-panel {
            position: absolute;
            top: calc(100% + 2px);
            left: 0;
            right: 0;
            min-width: 180px;
            background-color: var(--pico-background-color);
            border: var(--pico-border-width) solid var(--pico-form-element-border-color);
            border-radius: var(--pico-border-radius);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
            z-index: 200;
            padding: 0.5rem;
        }
        .tag-dropdown-options {
            display: flex;
            flex-direction: column;
            margin-bottom: 0.25rem;
        }
        .tag-option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.3rem 0.4rem;
            margin: 0;
            border-radius: calc(var(--pico-border-radius) / 2);
            cursor: pointer;
            font-weight: normal;
        }
        .tag-option:hover {
            background-color: var(--pico-muted-background-color);
        }
        .tag-option input[type="checkbox"] {
            flex-shrink: 0;
            margin: 0;
        }
        .tag-dropdown-clear {
            display: block;
            width: 100%;
            margin: 0;
            margin-top: 0.4rem;
            padding: 0.3rem 0.5rem;
            font-size: 0.85rem;
            border-top: 1px solid var(--pico-muted-border-color);
            padding-top: 0.4rem;
        }
        .recipe-count {
            color: var(--pico-muted-color);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
        .ing-exact {
            color: #2e7d32;
        }
        .ing-category {
            color: #f57c00;
        }
        .ing-missing {
            color: #c62828;
        }
        /* Shared chat bubble styles (used in chat_response.html partial) */
        .chat-turn { display: flex; flex-direction: column; gap: 0.5rem; }
        .chat-bubble { max-width: 80%; padding: 0.5rem 0.75rem; border-radius: var(--pico-border-radius); font-size: 0.9rem; }
        .chat-bubble.user { align-self: flex-end; background: var(--pico-primary-background); color: var(--pico-primary-inverse); }
        .chat-bubble.assistant { align-self: flex-start; background: var(--pico-muted-background-color); }
        .chat-bubble.error { color: var(--pico-del-color); }
        .chat-recommendations { margin-top: 0.5rem; }
        .chat-blurb { font-size: 0.8rem; color: var(--pico-muted-color); font-style: italic; margin: 0.35rem 0 0; }
        .htmx-indicator { display: none; color: var(--pico-muted-color); font-size: 0.85rem; }
        .htmx-request .htmx-indicator { display: inline; }
    </style>
</head>
<body>
    <header class="container">
        <nav>
            <ul>
                <li><strong>Cocktails</strong></li>
            </ul>
            <ul>
                <li><a href="{% url 'recipe_list' %}">All Recipes</a></li>
                <li><a href="{% url 'available_recipes' %}">Available</a></li>
                <li><a href="{% url 'chat_page' %}">Recommend</a></li>
                {% if user.is_authenticated %}
                <li>
                    <form method="post" action="{% url 'logout' %}" style="display:contents;">
                        {% csrf_token %}
                        <button type="submit" style="background:none;border:none;padding:var(--pico-nav-element-spacing-vertical) var(--pico-nav-element-spacing-horizontal);margin:0;color:var(--pico-contrast);font:inherit;cursor:pointer;">
                            Log out ({{ user.username }})
                        </button>
                    </form>
                </li>
                {% else %}
                <li><a href="{% url 'login' %}">Log in</a></li>
                {% endif %}
            </ul>
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
