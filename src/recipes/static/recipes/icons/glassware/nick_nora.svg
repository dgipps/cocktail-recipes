<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Narrow rim (much smaller than coupe) -->
  <line x1="11" y1="6" x2="21" y2="6"/>
  <!-- Rounded U-shaped bowl (deeper and rounder than coupe) -->
  <path d="M11 6C10.5 10 12.5 19 16 19C19.5 19 21.5 10 21 6"/>
  <!-- Slim stem -->
  <line x1="16" y1="19" x2="16" y2="27"/>
  <!-- Narrow base -->
  <line x1="11" y1="27" x2="21" y2="27"/>
</svg>
