{% extends "recipes/base.html" %}

{% block title %}My Inventory - Cocktails{% endblock %}

{% block head %}
<style>
  .inventory-table { width: 100%; border-collapse: collapse; }
  .inventory-table th,
  .inventory-table td { padding: 0.5rem 0.75rem; vertical-align: middle; }
  .inventory-table th { text-align: left; border-bottom: 2px solid var(--pico-muted-border-color); }
  .inventory-table tr + tr td { border-top: 1px solid var(--pico-muted-border-color); }
  .category-pill {
    display: inline-block;
    font-size: 0.75rem;
    color: var(--pico-muted-color);
    background: var(--pico-muted-background-color);
    border-radius: 999px;
    padding: 0.1rem 0.5rem;
    margin: 0.1rem;
  }
  .toggle-col { text-align: right; white-space: nowrap; }
  .toggle-col form { display: inline; margin: 0; }
  .toggle-col button { margin: 0; padding: 0.35rem 0.75rem; font-size: 0.875rem; }
  .result-count { color: var(--pico-muted-color); font-size: 0.9rem; margin-bottom: 1rem; }
</style>
{% endblock %}

{% block content %}
<h1>My Inventory <small style="font-size: 0.55em; font-weight: normal; color: var(--pico-muted-color);">{{ in_stock_count }} item{{ in_stock_count|pluralize }} in stock</small></h1>

<div class="filter-row">
  <input type="search"
         name="q"
         placeholder="Search ingredients..."
         value="{{ q }}"
         hx-get="{% url 'inventory' %}"
         hx-trigger="input changed delay:300ms, search"
         hx-target="#inventory-results"
         hx-push-url="true"
         hx-include="[name='cat'], [name='show']">

  <select name="cat"
          hx-get="{% url 'inventory' %}"
          hx-trigger="change"
          hx-target="#inventory-results"
          hx-push-url="true"
          hx-include="[name='q'], [name='show']">
    <option value="">All categories</option>
    {% for category in categories %}
    <option value="{{ category.pk }}" {% if cat == category.pk|stringformat:"s" %}selected{% endif %}>{{ category.name }}</option>
    {% endfor %}
  </select>

  <select name="show"
          hx-get="{% url 'inventory' %}"
          hx-trigger="change"
          hx-target="#inventory-results"
          hx-push-url="true"
          hx-include="[name='q'], [name='cat']">
    <option value="all" {% if show == "all" %}selected{% endif %}>All ingredients</option>
    <option value="in_stock" {% if show == "in_stock" %}selected{% endif %}>In stock only</option>
  </select>
</div>

<div id="inventory-results">
  {% include "inventory/partials/ingredient_list.html" %}
</div>
{% endblock %}
